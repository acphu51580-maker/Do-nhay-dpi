        // Công thức dựa trên logic:
        // - Màn hình càng lớn -> cần độ nhạy thấp hơn (vì tay di chuyển xa hơn)
        // - Tần số quét càng cao -> cần độ nhạy cao hơn (vì mượt hơn, phản hồi nhanh)
        // - Touch sampling càng cao -> cần độ nhạy cao hơn
        // - PPI càng cao -> cần độ nhạy thấp hơn chút (vì điểm ảnh nhỏ, di chuyển chính xác hơn)

        function calculateSensitivity(spec) {
            // Chuẩn hóa các thông số
            const inchFactor = 7.0 / spec.inch; // Màn 7 inch là chuẩn, nhỏ hơn thì tăng, lớn hơn thì giảm
            const hzFactor = spec.hz / 60;       // 60Hz là chuẩn
            const touchFactor = spec.touch / 60; // 60Hz touch là chuẩn
            const ppiFactor = 400 / spec.ppi;    // 400 PPI là chuẩn

            // Tính hệ số tổng hợp
            const totalFactor = inchFactor * (1 + (hzFactor - 1) * 0.3) * (1 + (touchFactor - 1) * 0.2) * (1 + (ppiFactor - 1) * 0.1);

            // Base sensitivity (mức trung bình cho máy 60Hz, 6.5 inch)
            const baseLook = 175;
            const baseRed = 148;
            const baseX2 = 170;
            const baseX4 = 180;
            const baseSniper = 172;
            const baseCam = 130;
            const baseFire = 40;
            const baseDpi = 400;

            // Áp dụng hệ số và làm tròn
            return {
                lookAround: Math.round(Math.min(200, Math.max(120, baseLook * totalFactor))),
                redDot: Math.round(Math.min(200, Math.max(100, baseRed * totalFactor))),
                scope2x: Math.round(Math.min(200, Math.max(110, baseX2 * totalFactor))),
                scope4x: Math.round(Math.min(200, Math.max(120, baseX4 * totalFactor))),
                sniperScope: Math.round(Math.min(200, Math.max(110, baseSniper * totalFactor))),
                camera: Math.round(Math.min(200, Math.max(80, baseCam * totalFactor))),
                fireButton: Math.round(Math.min(100, Math.max(20, baseFire * totalFactor))),
                dpi: Math.round(Math.min(600, Math.max(200, baseDpi * totalFactor)))
            };
        }

        // Tạo database độ nhạy từ specs
        const allDevices = {};
        for (let name in deviceSpecs) {
            allDevices[name] = calculateSensitivity(deviceSpecs[name]);
        }

        Object.keys(allDevices).sort().forEach(key => {
            let option = document.createElement('option');
            option.value = key;
            datalist.appendChild(option);
        });

            const inputVal = document.getElementById('deviceInput').value.trim().toLowerCase();
            const resultPanel = document.getElementById('resultPanel');
            const slidersContainer = document.getElementById('slidersContainer');
            const timeStamp = document.getElementById('timeStamp');
            const deviceNameDisplay = document.getElementById('deviceNameDisplay');
            const specInfo = document.getElementById('specInfo');

            if (!inputVal) { alert("Vui lòng nhập tên máy!"); return; }

            let deviceData = null;
            let foundName = "";
            let specData = null;

            // Tìm chính xác
            if (allDevices[inputVal]) {
                deviceData = allDevices[inputVal];
                specData = deviceSpecs[inputVal];
                foundName = inputVal;
            } else {
                // Tìm gần đúng
                for (let key in allDevices) {
                    if (key.includes(inputVal) || inputVal.includes(key)) {
                        deviceData = allDevices[key];
                        specData = deviceSpecs[key];
                        foundName = key;
                        break;
                    }
                }
            }

            if (!deviceData) {
                alert("Không tìm thấy máy: " + inputVal + "\nVui lòng thử máy khác trong danh sách gợi ý.");
                return;
            }

            deviceNameDisplay.innerText = foundName.toUpperCase();
            slidersContainer.innerHTML = '';
            const now = new Date();
            timeStamp.innerText = now.toLocaleTimeString('vi-VN') + ' | ' + now.toLocaleDateString('vi-VN');
            
            // Hiển thị thông số kỹ thuật
            if (specData) {
                specInfo.innerText = `Màn hình: ${specData.inch}" | ${specData.hz}Hz | Touch: ${specData.touch}Hz | PPI: ${specData.ppi}`;
            } else {
                specInfo.innerText = '';
            }

            const displayOrder = [
                { key: 'lookAround', label: '👁️ Nhìn Xung Quanh', max: 200 },
                { key: 'redDot', label: '🔴 Ống Ngắm Hồng Tâm', max: 200 },
                { key: 'scope2x', label: '🔭 Ống Ngắm X2', max: 200 },
                { key: 'scope4x', label: '🔭 Ống Ngắm X4', max: 200 },
                { key: 'sniperScope', label: '🎯 Ống Ngắm Súng Ngắm', max: 200 },
                { key: 'camera', label: '📷 Camera Nhìn Xung Quanh', max: 200 },
                { key: 'fireButton', label: '🔥 Nút Bắn', max: 100 },
                { key: 'dpi', label: '⚙️ DPI SENSITIVITY', max: 600 }
            ];

            displayOrder.forEach(item => {
                const value = deviceData[item.key];
                const percentage = Math.min((value / item.max) * 100, 100);
                slidersContainer.innerHTML += `
                    <div class="slider-item">
                        <div class="slider-info">
                            <span>${item.label}</span>
                            <span class="slider-value">${value}</span>
                        </div>
                        <div class="slider-bar">
                            <div class="slider-fill" style="width: 0%;" data-target="${percentage}%"></div>
                        </div>
                    </div>`;
            });

            resultPanel.style.display = 'block';
            setTimeout(() => {
                document.querySelectorAll('.slider-fill').forEach(fill => {
                    fill.style.width = fill.getAttribute('data-target');
                });
            }, 100);
        }

        function resetForm() {
            document.getElementById('deviceInput').value = '';
            document.getElementById('resultPanel').style.display = 'none';
        }
    </script>
</body>
</html>
