<?xml version="1.0" encoding="utf-8"?>
<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="#0A1128"
    android:padding="16dp">

    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical">

        <!-- Tiêu đề APP ĐỘ NHẠY -->
        <TextView
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="APP ĐỘ NHẠY - BLUE EDITION"
            android:textColor="#00FFFF"
            android:textSize="20sp"
            android:textStyle="bold"
            android:gravity="center"
            android:layout_marginBottom="16dp"/>

        <!-- Chọn Máy (Spinner) -->
        <Spinner
            android:id="@+id/spinnerDevice"
            android:layout_width="match_parent"
            android:layout_height="48dp"
            android:background="@drawable/bg_input"
            android:padding="8dp"
            android:layout_marginBottom="16dp"/>

        <!-- Nút LẤY ĐỘ NHẠY FREE -->
        <Button
            android:id="@+id/btnGetFree"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="LẤY ĐỘ NHẠY FREE"
            android:backgroundTint="#FF00FF"
            android:textColor="#FFFFFF"
            android:textStyle="bold"
            android:layout_marginBottom="16dp"/>

        <!-- Nút ĐẶT LẠI -->
        <Button
            android:id="@+id/btnReset"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="ĐẶT LẠI"
            android:backgroundTint="#1E3A8A"
            android:textColor="#FFFFFF"
            android:layout_marginBottom="24dp"/>

        <!-- Tiêu đề Premium -->
        <TextView
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="ĐỘ NHẠY PREMIUM"
            android:textColor="#FF00FF"
            android:textSize="18sp"
            android:textStyle="bold"
            android:layout_marginBottom="8dp"/>

        <!-- Các thanh trượt (Slider) -->
        <TextView android:text="Nhìn Xung Quanh" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content"/>
        <SeekBar android:id="@+id/sbLook" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="200" android:progress="180" android:progressTint="#00FFFF"/>

        <TextView android:text="Ống Ngắm Hồng Tâm" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp"/>
        <SeekBar android:id="@+id/sbRedDot" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="200" android:progress="152" android:progressTint="#00FFFF"/>

        <TextView android:text="Ống Ngắm X2" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp"/>
        <SeekBar android:id="@+id/sbX2" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="200" android:progress="179" android:progressTint="#00FFFF"/>

        <TextView android:text="Ống Ngắm X4" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp"/>
        <SeekBar android:id="@+id/sbX4" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="200" android:progress="186" android:progressTint="#00FFFF"/>

        <TextView android:text="Ống Ngắm Súng Ngắm" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp"/>
        <SeekBar android:id="@+id/sbSniper" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="200" android:progress="177" android:progressTint="#00FFFF"/>

        <TextView android:text="Camera Nhìn Xung Quanh" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp"/>
        <SeekBar android:id="@+id/sbCam" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="200" android:progress="135" android:progressTint="#00FFFF"/>

        <!-- Nút Bấm và DPI -->
        <TextView android:text="Nút Bấm: 40%" android:textColor="#FF00FF" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="16dp"/>
        <TextView android:text="DPI SENSITIVITY: 400" android:textColor="#00FFFF" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp"/>

    </LinearLayout>
</ScrollView>
