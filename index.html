<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Độ Nhạy FF & DPI</title>
    <style>
        /* Giao diện màu đỏ Gaming */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background: linear-gradient(145deg, #1a0000, #330000);
            border: 2px solid #ff0000;
            border-radius: 15px;
            padding: 25px 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7), inset 0 0 15px rgba(255, 0, 0, 0.4);
            text-align: center;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
            to { box-shadow: 0 0 35px rgba(255, 0, 0, 1); }
        }

        h1 {
            color: #ff3333;
            text-transform: uppercase;
            font-size: 20px;
            margin-bottom: 20px;
            text-shadow: 0 0 12px #ff0000;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff4d4d;
            background-color: #260000;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
        }

        input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 15px #ff0000;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #cc0000, #ff1a1a);
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.6);
        }

        button:active {
            transform: scale(0.96);
        }

        .result-box {
            display: none;
            background-color: #140000;
            border: 1px solid #ff3333;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box h2 {
            color: #ff4d4d;
            font-size: 16px;
            margin-top: 0;
            border-bottom: 1px solid #ff3333;
            padding-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 15px;
            border-bottom: 1px dashed #4d0000;
            padding-bottom: 5px;
        }

        .stat-row span:last-child {
            color: #ff9999;
            font-weight: bold;
        }
        
        .dpi-box {
            background-color: #cc0000;
            color: white;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
            box-shadow: 0 0 15px #cc0000;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 Tool Độ Nhạy FF & DPI 🔥</h1>
        
        <div class="input-group">
            <input type="text" id="deviceInput" placeholder="Nhập tên máy (VD: Note 12, iPhone 13...)">
            <button onclick="getSettings()">TÌM CÀI ĐẶT CHUẨN</button>
        </div>

        <div id="result" class="result-box">
            <h2 id="deviceName">Tên máy</h2>
            <div class="stat-row"><span>General:</span> <span id="general">0</span></div>
            <div class="stat-row"><span>Red Dot:</span> <span id="redDot">0</span></div>
            <div class="stat-row"><span>2x Scope:</span> <span id="scope2x">0</span></div>
            <div class="stat-row"><span>4x Scope:</span> <span id="scope4x">0</span></div>
            <div class="stat-row"><span>AWM Scope:</span> <span id="awm">0</span></div>
            <div class="stat-row"><span>Free Look:</span> <span id="freeLook">0</span></div>
            <div class="dpi-box">DPI ĐỀ XUẤT: <span id="dpi">0</span></div>
        </div>
        <div id="errorBox" class="error-msg" style="display: none;"></div>
    </div>

    <script>
        // ==========================================
        // DATABASE ĐỘ NHẠY CHUẨN TỪNG DÒNG MÁY
        // ==========================================
        const phoneDatabase = {
            // --- APPLE (IPHONE) ---
            "iphone 15 pro max": { g: 100, rd: 100, s2: 95, s4: 90, awm: 85, fl: 100, dpi: 650 },
            "iphone 15 pro": { g: 100, rd: 98, s2: 94, s4: 88, awm: 84, fl: 98, dpi: 640 },
            "iphone 15": { g: 98, rd: 96, s2: 92, s4: 86, awm: 82, fl: 96, dpi: 600 },
            "iphone 14 pro max": { g: 98, rd: 96, s2: 92, s4: 86, awm: 82, fl: 96, dpi: 620 },
            "iphone 14": { g: 96, rd: 94, s2: 90, s4: 84, awm: 80, fl: 94, dpi: 580 },
            "iphone 13 pro max": { g: 96, rd: 94, s2: 90, s4: 84, awm: 80, fl: 94, dpi: 600 },
            "iphone 13": { g: 95, rd: 92, s2: 88, s4: 82, awm: 78, fl: 92, dpi: 560 },
            "iphone 12": { g: 92, rd: 90, s2: 85, s4: 80, awm: 75, fl: 90, dpi: 540 },
            "iphone 11": { g: 90, rd: 88, s2: 82, s4: 78, awm: 72, fl: 88, dpi: 520 },
            "iphone xr": { g: 88, rd: 85, s2: 80, s4: 75, awm: 70, fl: 85, dpi: 500 },
            "iphone se": { g: 85, rd: 82, s2: 78, s4: 72, awm: 68, fl: 82, dpi: 480 },

            // --- SAMSUNG ---
            "samsung s24 ultra": { g: 98, rd: 95, s2: 90, s4: 85, awm: 80, fl: 95, dpi: 580 },
            "samsung s23 ultra": { g: 96, rd: 92, s2: 88, s4: 82, awm: 78, fl: 92, dpi: 560 },
            "samsung s22": { g: 94, rd: 90, s2: 85, s4: 80, awm: 75, fl: 90, dpi: 550 },
            "samsung s21": { g: 92, rd: 88, s2: 82, s4: 78, awm: 72, fl: 88, dpi: 520 },
            "samsung s20": { g: 90, rd: 86, s2: 80, s4: 76, awm: 70, fl: 86, dpi: 510 },
            "samsung s10e": { g: 85, rd: 82, s2: 76, s4: 72, awm: 66, fl: 82, dpi: 460 },
            "samsung note 20": { g: 92, rd: 88, s2: 82, s4: 78, awm: 72, fl: 88, dpi: 520 },
            "samsung note 10": { g: 89, rd: 86, s2: 80, s4: 76, awm: 70, fl: 86, dpi: 510 },
            "samsung a54": { g: 88, rd: 85, s2: 78, s4: 74, awm: 68, fl: 85, dpi: 480 },
            "samsung a53": { g: 86, rd: 82, s2: 76, s4: 72, awm: 66, fl: 82, dpi: 470 },
            "samsung a52": { g: 85, rd: 80, s2: 75, s4: 70, awm: 65, fl: 80, dpi: 460 },
            "samsung a12": { g: 80, rd: 78, s2: 72, s4: 68, awm: 62, fl: 78, dpi: 430 },

            // --- XIAOMI / REDMI / POCO ---
            "redmi note 13": { g: 92, rd: 88, s2: 82, s4: 78, awm: 72, fl: 88, dpi: 520 },
            "redmi note 12": { g: 90, rd: 86, s2: 80, s4: 76, awm: 70, fl: 86, dpi: 510 },
            "redmi note 11": { g: 88, rd: 85, s2: 78, s4: 74, awm: 68, fl: 85, dpi: 500 },
            "redmi note 10": { g: 86, rd: 82, s2: 76, s4: 72, awm: 66, fl: 82, dpi: 490 },
            "poco x5": { g: 92, rd: 88, s2: 82, s4: 78, awm: 72, fl: 88, dpi: 530 },
            "poco x3": { g: 88, rd: 85, s2: 78, s4: 74, awm: 68, fl: 85, dpi: 500 },
            "poco f5": { g: 94, rd: 90, s2: 85, s4: 80, awm: 75, fl: 90, dpi: 550 },
            "xiaomi 13": { g: 96, rd: 94, s2: 90, s4: 84, awm: 80, fl: 94, dpi: 570 },
            "xiaomi 12": { g: 94, rd: 91, s2: 86, s4: 81, awm: 76, fl: 91, dpi: 550 },

            // --- OPPO / VIVO / REALME ---
            "oppo reno 8": { g: 90, rd: 86, s2: 80, s4: 76, awm: 70, fl: 86, dpi: 510 },
            "oppo a57": { g: 82, rd: 78, s2: 72, s4: 68, awm: 62, fl: 78, dpi: 440 },
            "oppo a58": { g: 84, rd: 80, s2: 74, s4: 70, awm: 64, fl: 80, dpi: 460 },
            "realme c55": { g: 84, rd: 80, s2: 74, s4: 70, awm: 64, fl: 80, dpi: 450 },
            "vivo y21": { g: 82, rd: 78, s2: 72, s4: 68, awm: 62, fl: 78, dpi: 440 },
            "vivo y35": { g: 85, rd: 82, s2: 76, s4: 72, awm: 66, fl: 82, dpi: 460 },

            // --- NOKIA / ASUS ---
            "nokia g50": { g: 82, rd: 78, s2: 72, s4: 68, awm: 62, fl: 78, dpi: 440 },
            "nokia x20": { g: 84, rd: 80, s2: 74, s4: 70, awm: 64, fl: 80, dpi: 450 },
            "rog phone 6": { g: 100, rd: 98, s2: 95, s4: 90, awm: 85, fl: 100, dpi: 600 },
            "rog phone 5": { g: 98, rd: 95, s2: 92, s4: 88, awm: 82, fl: 98, dpi: 580 }
        };

        function getSettings() {
            const inputField = document.getElementById('deviceInput');
            let input = inputField.value.toLowerCase().trim();
            const resultBox = document.getElementById('result');
            const errorBox = document.getElementById('errorBox');
            
            resultBox.style.display = 'none';
            errorBox.style.display = 'none';

            if (input === "") {
                errorBox.innerText = "Vui lòng nhập tên dòng máy của bạn!";
                errorBox.style.display = 'block';
                return;
            }

            // Xóa toàn bộ khoảng trắng để tìm kiếm thông minh hơn (VD: "note 12" -> "note12")
            let searchKey = input.replace(/\s+/g, ''); 
            let settings = null;
            let matchedName = "";

            // 1. Tìm kiếm chính xác tuyệt đối trước
            for (let key in phoneDatabase) {
                let cleanKey = key.replace(/\s+/g, ''); // "redminote12"
                if (cleanKey === searchKey) {
                    settings = phoneDatabase[key];
                    matchedName = inputField.value.toUpperCase();
                    break;
                }
            }

            // 2. Nếu không có chính xác, tìm kiếm gần đúng (Bao gồm từ khóa)
            if (!settings) {
                for (let key in phoneDatabase) {
                    let cleanKey = key.replace(/\s+/g, ''); 
                    // Ví dụ: searchKey="note12", cleanKey="redminote12" -> Thỏa mãn
                    if (cleanKey.includes(searchKey)) {
                        settings = phoneDatabase[key];
                        matchedName = inputField.value.toUpperCase();
                        break;
                    }
                }
            }

            // Nếu vẫn không tìm thấy
            if (!settings) {
                errorBox.innerHTML = `❌ Không tìm thấy cấu hình cho máy "<b>${inputField.value}</b>".<br>Vui lòng kiểm tra lại tên máy (VD: Note 12, S10e, iPhone 13...).`;
                errorBox.style.display = 'block';
                return;
            }

            // Hiển thị kết quả
            document.getElementById('deviceName').innerText = `✅ CHUẨN: ${matchedName}`;
            document.getElementById('general').innerText = settings.g;
            document.getElementById('redDot').innerText = settings.rd;
            document.getElementById('scope2x').innerText = settings.s2;
            document.getElementById('scope4x').innerText = settings.s4;
            document.getElementById('awm').innerText = settings.awm;
            document.getElementById('freeLook').innerText = settings.fl;
            document.getElementById('dpi').innerText = settings.dpi;

            resultBox.style.display = 'block';
        }
    </script>

</body>
</html>
