<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Độ Nhạy FF & DPI</title>
    <style>
        /* Giao diện màu đỏ Gaming */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background: linear-gradient(145deg, #1a0000, #330000);
            border: 2px solid #ff0000;
            border-radius: 15px;
            padding: 25px 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7), inset 0 0 15px rgba(255, 0, 0, 0.4);
            text-align: center;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
            to { box-shadow: 0 0 35px rgba(255, 0, 0, 1); }
        }

        h1 {
            color: #ff3333;
            text-transform: uppercase;
            font-size: 20px;
            margin-bottom: 20px;
            text-shadow: 0 0 12px #ff0000;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff4d4d;
            background-color: #260000;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
        }

        input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 15px #ff0000;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #cc0000, #ff1a1a);
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.6);
        }

        button:active {
            transform: scale(0.96);
        }

        .result-box {
            display: none;
            background-color: #140000;
            border: 1px solid #ff3333;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box h2 {
            color: #ff4d4d;
            font-size: 16px;
            margin-top: 0;
            border-bottom: 1px solid #ff3333;
            padding-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 15px;
            border-bottom: 1px dashed #4d0000;
            padding-bottom: 5px;
        }

        .stat-row span:last-child {
            color: #ff9999;
            font-weight: bold;
        }
        
        .dpi-box {
            background-color: #cc0000;
            color: white;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
            box-shadow: 0 0 15px #cc0000;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>

        function getSettings() {
            const inputField = document.getElementById('deviceInput');
            let input = inputField.value.toLowerCase().trim();
            const resultBox = document.getElementById('result');
            const errorBox = document.getElementById('errorBox');
            
            // Ẩn kết quả cũ
            resultBox.style.display = 'none';
            errorBox.style.display = 'none';

            if (input === "") {
                errorBox.innerText = "Vui lòng nhập tên dòng máy của bạn!";
                errorBox.style.display = 'block';
                return;
            }

            // Chuẩn hóa chuỗi (Xóa khoảng trắng thừa, viết thường)
            let searchKey = input.replace(/\s+/g, ' '); 
            let settings = null;
            let matchedName = "";

            // Tìm kiếm chính xác trong Database
            for (let key in phoneDatabase) {
                if (searchKey.includes(key)) {
                    settings = phoneDatabase[key];
                    matchedName = inputField.value.toUpperCase();
                    break;
                }
            }

            // Nếu không tìm thấy máy cụ thể trong Database
            if (!settings) {
                errorBox.innerHTML = `❌ Không tìm thấy cấu hình cho máy "<b>${inputField.value}</b>".<br>Vui lòng kiểm tra lại tên máy hoặc thử tên viết tắt (VD: ip 13, sam s10e...).`;
                errorBox.style.display = 'block';
                return;
            }

            // Hiển thị kết quả
            document.getElementById('deviceName').innerText = `✅ CHUẨN: ${matchedName}`;
            document.getElementById('general').innerText = settings.g;
            document.getElementById('redDot').innerText = settings.rd;
            document.getElementById('scope2x').innerText = settings.s2;
            document.getElementById('scope4x').innerText = settings.s4;
            document.getElementById('awm').innerText = settings.awm;
            document.getElementById('freeLook').innerText = settings.fl;
            document.getElementById('dpi').innerText = settings.dpi;

            resultBox.style.display = 'block';
        }
