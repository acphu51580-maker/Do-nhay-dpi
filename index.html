<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Độ Nhạy Free Fire - Random</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0A1128;
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border: 2px solid #00FFFF;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        h1 {
            text-align: center;
            color: #00FFFF;
            font-size: 20px;
            text-shadow: 0 0 10px #00FFFF;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .input-group { margin-bottom: 15px; position: relative; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #1E3A8A;
            border: 1px solid #00FFFF;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]::placeholder { color: #94a3b8; }

        #errorMsg {
            color: #ff4d4d;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
            font-weight: bold;
        }
        #successMsg {
            color: #00ff88;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
            fontDev-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 12pxices;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px();
            cursor: pointer;
            margin-bottom: 10px;
            text {
-transform: uppercase;
            transition: 0.3s;
        }
        .btn-free {        background: #FF00FF; color: white; box-shadow: 0 0 10px #FF00FF; }
        . letbtn-free:hover { background: #d400d4; }
        .btn-reset { background: #1E3A8A; color: white; border: 1px solid #00FFFF; }

        .slider-group { margin-bottom: 15px; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
            color: #e2e8f0;
        }
        .slider-label span:last-child { color: #00FFFF; font-weight: bold; }
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            background: #1E3A8A;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #00FFFF;
            margin-top: -6px;
            box-shadow: 0 0 10px #00FFFF;
            cursor: pointer;
        }
        .dpi-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-top: 15px;
            color: #FF00FF;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>APP ĐỘ NHẠY - FF</h1>

    <div class="input-group">
        <input type="text" id="deviceInput" list="deviceList" placeholder="Nhập tên máy (VD: iOS 16, Realme Note 50...)" autocomplete="off">
        <datalist id="deviceList"></datalist>
    </div>
    
    <div id="errorMsg">❌ Dòng máy này chưa có trong danh sách!</div>
    <div id="successMsg">🎲 Đang random độ nhạy...</div>

    <button class="btn btn-free" onclick="applySensitivity()">⚡ LẤY ĐỘ NHẠY FREE</button>
    <button class="btn btn-reset" onclick="resetSliders()">🔄 ĐẶT LẠI</button>

    <div class="slider-group">
        <div class="slider-label"><span>Nhìn Xung Quanh</span><span id="val-look">0</span></div>
        <input type="range" id="slider-look" min="0" max="200" value="0" oninput="updateValue('look', this.value)">
    </div>
    <div class="slider-group">
        <div class="slider-label"><span>Ống Ngắm Hồng Tâm</span><span id="val-reddot">0</span></div>
        <input type="range" id="slider-reddot" min="0" max="200" value="0" oninput="updateValue('reddot', this.value)">
    </div>
    <div class="slider-group">
        <div class="slider-label"><span>Ống Ngắm X2</span><span id="val-x2">0</span></div>
        <input type="range" id="slider-x2" min="0" max="200" value="0" oninput="updateValue('x2', this.value)">
    </div>
    <div class="slider-group">
        <div class="slider-label"><span>Ống Ngắm X4</span><span id="val-x4">0</span></div>
        <input type="range" id="slider-x4" min="0" max="200" value="0" oninput="updateValue('x4', this.value)">
    </div>
    <div class="slider-group">
        <div class="slider-label"><span>Ống Ngắm Súng Ngắm</span><span id="val-sniper">0</span></div>
        <input type="range" id="slider-sniper" min="0" max="200" value="0" oninput="updateValue('sniper', this.value)">
    </div>
    <div class="slider-group">
        <div class="slider-label"><span>Camera Nhìn Xung Quanh</span><span id="val-cam">0</span></div>
        <input type="range" id="slider-cam" min="0" max="200" value="0" oninput="updateValue('cam', this.value)">
    </div>

    <div class="dpi-text">
        <span>Nút Bấm: <span id="val-btn">0</span>%</span>
        <span>DPI: <span id="val-dpi">0</span></span>
    </div>
</div>

<script>
    // ==========================================
    // 1. TẠO DANH SÁCH 100 DÒNG MÁY
    // ==========================================
    const deviceList = document.getElementById('deviceList');
    
    const devices = [
        "iOS 16", "iOS 15", "iOS 14", "iOS 13", "iPhone 15 Pro Max", "iPhone 14", "iPhone 13", "iPhone 12", "iPhone 11", "iPhone X",
        "Samsung Galaxy S24 Ultra", "Samsung Galaxy S23", "Samsung Galaxy A54", "Samsung Galaxy A34", "Samsung Galaxy M14", "Samsung Galaxy Note 20",
        "Xiaomi 14 Pro", "Xiaomi Redmi Note 13", "Xiaomi Redmi Note 12", "Xiaomi Redmi 10", "Xiaomi Poco X6", "Xiaomi Poco M5",
        "Oppo Reno 11", "Oppo Reno 8", "Oppo A98", "Oppo A58", "Oppo Find N3",
        "Realme Note 50", "Realme 11 Pro", "Realme C55", "Realme C53", "Realme GT Neo 5",
        "Vivo V29", "Vivo Y36", "Vivo Y27", "Vivo T2", "Vivo X100",
        "Asus ROG Phone 7", "Nubia Red Magic 8", "OnePlus 11", "Huawei P60", "Nokia G42"
    ];

    function generate100 fullList = [];
        for (let i = 0; i < devices.length; i++) fullList.push(devices[i]);
        let suffix = 1;
        while (fullList.length < 100) {
            fullList.push(devices[fullList.length % devices.length] + " (" + suffix + ")");
            suffix++;
        }
        return fullList.slice(0, 100);
    }

    const finalDeviceList = generate100Devices();
    finalDeviceList.forEach(device => {
        const option = document.createElement('option');
        option.value = device;
        deviceList.appendChild(option);
    });

    // ==========================================
    // 2. HÀM RANDOM ĐỘ NHẠY
    // ==========================================
    // Random trong khoảng min - max (mặc định 100 - 200)
    function randomSensitivity(min = 100, max = 200) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Random Nút Bấm (khoảng 30 - 60%)
    function randomBtn() {
        return Math.floor(Math.random() * (60 - 30 + 1)) + 30;
    }

    // Random DPI (khoảng 350 - 480)
    function randomDpi() {
        return Math.floor(Math.random() * (480 - 350 + 1)) + 350;
    }

    // ==========================================
    // 3. LOGIC CHẠY HIỆU ỨNG
    // ==========================================
    let animationId = null;

    function animateValue(id, start, end, duration, callback) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const currentValue = Math.floor(progress * (end - start) + start);
            callback(currentValue);
            if (progress < 1) {
                animationId = window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }

    function updateValue(key, value) {
        document.getElementById('val-' + key).innerText = value;
    }

    function applySensitivity() {
        const inputVal = document.getElementById('deviceInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        // Kiểm tra ô nhập có trống không
        if (inputVal === "") {
            errorMsg.style.display = 'block';
            errorMsg.innerText = '❌ Vui lòng nhập tên dòng máy!';
            successMsg.style.display = 'none';
            resetSliders();
            return;
        }

        // Kiểm tra máy có trong danh sách không (so sánh không phân biệt hoa thường)
        const isExist = finalDeviceList.some(d => d.toLowerCase() === inputVal.toLowerCase());
        
        if (!isExist) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = '❌ Dòng máy "' + inputVal + '" không có trong danh sách!';
            successMsg.style.display = 'none';
            resetSliders();
            return;
        }

        // Nếu đúng thì bắt đầu random
        errorMsg.style.display = 'none';
        successMsg.style.display = 'block';
        successMsg.innerText = '🎲 Đã random độ nhạy cho: ' + inputVal;

        if (animationId) cancelAnimationFrame(animationId);

        // Reset về 0 trước khi chạy
        const sliders = ['look', 'reddot', 'x2', 'x4', 'sniper', 'cam'];
        sliders.forEach(s => {
            document.getElementById('slider-' + s).value = 0;
            document.getElementById('val-' + s).innerText = 0;
        });
        document.getElementById('val-btn').innerText = 0;
        document.getElementById('val-dpi').innerText = 0;

        // Tạo bộ số random mới mỗi lần bấm
        const randomData = {
            look: randomSensitivity(150, 195),
            reddot: randomSensitivity(130, 175),
            x2: randomSensitivity(150, 195),
            x4: randomSensitivity(160, 200),
            sniper: randomSensitivity(150, 195),
            cam: randomSensitivity(120, 160),
            btn: randomBtn(),
            dpi: randomDpi()
        };

        // Chạy hiệu ứng từ 0 lên số random
        setTimeout(() => {
            sliders.forEach(key => {
                const targetSlider = document.getElementById('slider-' + key);
                const targetText = document.getElementById('val-' + key);
                animateValue(key, 0, randomData[key], 1500, (val) => {
                    targetSlider.value = val;
                    targetText.innerText = val;
                });
            });

            animateValue('btn', 0, randomData.btn, 1500, (val) => {
                document.getElementById('val-btn').innerText = val;
            });
            animateValue('dpi', 0, randomData.dpi, 1500, (val) => {
                document.getElementById('val-dpi').innerText = val;
            });
        }, 100);
    }

    function resetSliders() {
        if (animationId) cancelAnimationFrame(animationId);
        const sliders = ['look', 'reddot', 'x2', 'x4', 'sniper', 'cam'];
        sliders.forEach(s => {
            document.getElementById('slider-' + s).value = 0;
            document.getElementById('val-' + s).innerText = 0;
        });
        document.getElementById('val-btn').innerText = 0;
        document.getElementById('val-dpi').innerText = 0;
    }
</script>

</body>
</html>
